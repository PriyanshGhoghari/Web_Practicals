<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub Portal — My Timetable</title>
</head>

<body>

  <nav>
    <div>
      <span>&#9679;</span> StudentHub Portal
      <small>(admin/teacher)</small>
    </div>

    <div>
      <a href="admin-dashboard.html">Admin Dashboard</a>
      <a href="#">Logout</a>
    </div>
  </nav>

  <div>
    <div>
      <div>
        <label for="adminDaySelect">Select day</label>
        <select id="adminDaySelect">
          <option selected>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
        </select>
      </div>
    </div>

    <div>
      <h2>My classes for selected day</h2>

      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Subject</th>
            <th>Batch</th>
            <th>Room</th>
          </tr>
        </thead>

        <tbody id="adminTimetableBody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    &copy; 2026 College Name. All rights reserved.
  </footer>

</body>
</html>
