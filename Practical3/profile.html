<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub Portal — Profile</title>

    <link rel="stylesheet" href="CSS/profile.css">
</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            <img src="Images/student_icon.png" alt="StudentHub">
            <span>StudentHub</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="#">Logout</a>
        </div>

    </nav>


    <main class="profile-page">

        <section class="profile-card">

            <div class="profile-top">

                <div class="profile-photo">
                    <img src="" alt="Profile photo" id="profilePhoto">
                </div>

                <div class="profile-title">
                    <h1 id="profileName">25DCE029</h1>
                    <p>25dce029@charusat.edu.in</p>
                </div>

            </div>


            <form id="profileForm">

                <div class="profile-grid">

                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId">
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName">
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="text" id="dob" placeholder="DD/MM/YYYY">
                    </div>

                    <div class="form-group">
                        <label for="bloodGroup">Blood Group</label>
                        <input type="text" id="bloodGroup">
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <input type="text" id="gender">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone No</label>
                        <input type="tel" id="phone">
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address</label>
                        <input type="text" id="address">
                    </div>

                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input type="text" id="pincode">
                    </div>

                    <div class="form-group">
                        <label for="aadhaar">Aadhaar</label>
                        <input type="text" id="aadhaar">
                    </div>

                    <div class="form-group">
                        <label for="guardianName">Guardian Name</label>
                        <input type="text" id="guardianName">
                    </div>

                    <div class="form-group">
                        <label for="guardianPhone">Guardian Phone</label>
                        <input type="tel" id="guardianPhone">
                    </div>

                </div>


                <div class="save-container">
                    <button type="submit">Save Changes</button>
                </div>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
    </footer>

</body>

</html>
